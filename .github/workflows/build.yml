name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD: ${{ github.run_number }}
        run: |
          python -m pip install -r requirements.txt pyinstaller
          sed -i '' "s/^BUILD = .*/BUILD = $BUILD/" _version.py
          python test_stitch.py
          python test_updater.py
          pyinstaller --noconfirm --windowed --name ScrollShot \
            --osx-bundle-identifier com.enessboz.scrollshot \
            --hidden-import Quartz --hidden-import ApplicationServices launcher.py
          ditto -c -k --keepParent dist/ScrollShot.app ScrollShot-mac.zip
          zip code.zip app.py scrollshot.py updater.py _version.py
          gh release create "build-$BUILD" ScrollShot-mac.zip code.zip \
            --title "ScrollShot build $BUILD" \
            --notes "İlk kurulum: ScrollShot-mac.zip. Kurulu uygulama kendini code.zip ile otomatik günceller." \
            --latest
